# 潮鳴りの密室: 512 KiB LoROM (16 banks of 32 KiB), 8 KiB battery SRAM at $70:0000, no copier header.
# bank 0: code + tables + scripts, bank 1: font, then text banks, one bank per picture, portraits
# (tools/adv/build.py decides which BANKn segments are used; an unused bank is filled with $FF).
MEMORY {
 ZP:    start=$000000, size=$0100, type=rw;
 RAM:   start=$000200, size=$1C00, type=rw;     # $1E00-$1FFF: stack
 HRAM:  start=$7E2000, size=$6000, type=rw;
 ROM0:  start=$008000, size=$7FC0, file=%O, fill=yes, fillval=$FF;
 HDR:   start=$00FFC0, size=$0040, file=%O, fill=yes, fillval=$00;
 ROM1:  start=$018000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM2:  start=$028000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM3:  start=$038000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM4:  start=$048000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM5:  start=$058000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM6:  start=$068000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM7:  start=$078000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM8:  start=$088000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM9:  start=$098000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM10: start=$0A8000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM11: start=$0B8000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM12: start=$0C8000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM13: start=$0D8000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM14: start=$0E8000, size=$8000, file=%O, fill=yes, fillval=$FF;
 ROM15: start=$0F8000, size=$8000, file=%O, fill=yes, fillval=$FF;
}
SEGMENTS {
 ZEROPAGE: load=ZP,    type=zp;
 BSS:      load=RAM,   type=bss, define=yes;
 HIBSS:    load=HRAM,  type=bss, define=yes;
 CODE:     load=ROM0,  type=ro;
 RODATA:   load=ROM0,  type=ro;
 HEADER:   load=HDR,   type=ro, start=$00FFC0;
 BANK1:    load=ROM1,  type=ro, optional=yes;
 BANK2:    load=ROM2,  type=ro, optional=yes;
 BANK3:    load=ROM3,  type=ro, optional=yes;
 BANK4:    load=ROM4,  type=ro, optional=yes;
 BANK5:    load=ROM5,  type=ro, optional=yes;
 BANK6:    load=ROM6,  type=ro, optional=yes;
 BANK7:    load=ROM7,  type=ro, optional=yes;
 BANK8:    load=ROM8,  type=ro, optional=yes;
 BANK9:    load=ROM9,  type=ro, optional=yes;
 BANK10:   load=ROM10, type=ro, optional=yes;
 BANK11:   load=ROM11, type=ro, optional=yes;
 BANK12:   load=ROM12, type=ro, optional=yes;
 BANK13:   load=ROM13, type=ro, optional=yes;
 BANK14:   load=ROM14, type=ro, optional=yes;
 BANK15:   load=ROM15, type=ro, optional=yes;
}
