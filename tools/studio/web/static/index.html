<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFC Studio</title>
  <link rel="stylesheet" href="studio.css">
  <script type="module" src="studio.js"></script>
</head>
<body>
  <header class="titlebar" inert>
    <a href="./" class="brand" aria-label="SFC Studio home"><span class="mark" aria-hidden="true"></span>SFC <b>Studio</b></a>
    <span id="project-title">Starting Studio…</span>
    <div class="actions">
      <button id="open" type="button">Open file</button>
      <button id="directory" type="button">Open folder</button>
      <button id="save" class="primary" type="button">Save / export</button>
      <button id="tools" type="button">Tools</button>
    </div>
  </header>
  <main class="studio" inert>
    <aside class="library" aria-labelledby="library-title">
      <div class="section-title"><h2 id="library-title">Project assets</h2><button id="add" type="button" title="New asset" aria-label="New asset">＋</button></div>
      <input id="search" type="search" aria-label="Filter assets" placeholder="Filter assets">
      <nav id="assets" aria-label="Assets"></nav>
    </aside>
    <section class="workspace" aria-labelledby="asset-title">
      <div class="workspace-head">
        <div><p id="asset-kind" class="eyebrow"></p><h1 id="asset-title">Project</h1></div>
        <div class="actions">
          <button id="undo" type="button" title="Undo (Ctrl or ⌘ Z)" disabled>↶ Undo</button>
          <button id="redo" type="button" title="Redo (Ctrl or ⌘ Shift Z)" disabled>↷ Redo</button>
          <button id="export-asset" type="button">Export asset</button>
        </div>
      </div>
      <div id="toolbar"></div>
      <div class="stage" id="stage">
        <div id="stage-content">
          <div id="board" hidden>
            <canvas id="preview" tabindex="0" aria-label="Asset preview"></canvas>
            <div id="overlay" aria-hidden="true"></div>
          </div>
          <p id="stage-message"></p>
        </div>
      </div>
      <div id="coordinates"></div>
    </section>
    <aside class="inspector" aria-labelledby="inspector-title">
      <div class="section-title"><h2 id="inspector-title">Inspector</h2></div>
      <div id="inspector"></div>
    </aside>
  </main>
  <footer><button id="validation" type="button" inert>Validation</button><span id="status" role="status"></span><span id="format">Project format v1</span></footer>
  <input id="project-file" type="file" accept=".json,.zip" hidden>
  <dialog id="dialog"><form id="dialog-content"></form></dialog>
</body>
</html>
