<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Studio project workflow regressions</title>
<!-- After web/build.sh, serve tools/studio over localhost and open /web/tests/folder-workflows.html.
     Launch Chrome with --autoplay-policy=no-user-gesture-required for the scripted playback tests. -->
<pre id="result" data-result="running">Running…</pre>
<iframe id="workbench" title="Studio under test"></iframe>
<script type="module">
  const result = document.getElementById("result");
  const iframe = document.getElementById("workbench");
  const picks = [];
  let confirmations = 0;
  let demoRead;
  window.pickFolder = () => {
    if (!picks.length) throw new Error("No test folder queued");
    return picks.shift();
  };
  window.confirmDiscard = () => { confirmations++; return false; };
  window.pauseDemoRead = () => demoRead?.pause();

  function equal(actual, expected, description) {
    if (actual !== expected) throw new Error(`${description}: expected ${expected}, got ${actual}`);
  }

  function folder(name, content, { beforeRead, beforeWrite, beforeClose, onAbort } = {}) {
    const files = new Map(content ? [["studio.json", content]] : []);
    return {
      name, files,
      async *keys() { yield* files.keys(); },
      async getFileHandle(key, { create = false } = {}) {
        if (!files.has(key)) {
          if (!create) throw new DOMException("Missing file", "NotFoundError");
          files.set(key, new Uint8Array());
        }
        return {
          async getFile() {
            const file = new Blob([files.get(key)]);
            return {
              size: file.size,
              async arrayBuffer() { await beforeRead?.(); return file.arrayBuffer(); },
            };
          },
          async createWritable() {
            let pending;
            return {
              async write(bytes) { await beforeWrite?.(); pending = bytes; },
              async close() { await beforeClose?.(); files.set(key, pending); },
              async abort() { pending = undefined; onAbort?.(); },
            };
          },
        };
      },
      async removeEntry(key) { files.delete(key); },
    };
  }

  function gate() {
    const entered = Promise.withResolvers();
    const released = Promise.withResolvers();
    return {
      entered: entered.promise,
      pause() { entered.resolve(); return released.promise; },
      resume: released.resolve,
    };
  }

  function report(state, text) {
    result.dataset.result = state;
    result.textContent = text;
  }

  const timeout = setTimeout(() => report("failed", "Timed out waiting for Studio or test I/O."), 10000);
  try {
    const site = "../../_site/";
    const response = await fetch(site + "index.html");
    if (!response.ok) throw new Error("Build Studio with web/build.sh before running these tests.");
    const html = await response.text();
    const loaded = new Promise((resolve) => { iframe.onload = resolve; });
    iframe.srcdoc = html.replace("<head>", `<head><base href="${site}">
      <script>
        window.showDirectoryPicker = parent.pickFolder;
        window.confirm = parent.confirmDiscard;
        const fetchStudio = window.fetch.bind(window);
        window.fetch = async (url, options) => {
          if (url === "./demo/studio.json") await parent.pauseDemoRead();
          return fetchStudio(url, options);
        };
      <\/script>`);
    await loaded;
    const doc = iframe.contentDocument;
    const byId = (id) => doc.getElementById(id);
    while (doc.querySelector("header").inert) {
      await new Promise((resolve) => setTimeout(resolve, 20));
      if (result.dataset.result === "failed") throw new Error(byId("status").textContent);
    }

    const project = (name, assets = {}) => new TextEncoder().encode(JSON.stringify({ version: 1, name, assets }));
    const savedName = (directory) => JSON.parse(new TextDecoder().decode(directory.files.get("studio.json"))).name;
    const open = (directory) => { picks.push(directory); return byId("directory").onclick(); };
    const submitDialog = () => byId("dialog-content").onsubmit(new iframe.contentWindow.Event("submit"));
    const rename = (name) => {
      doc.querySelector("#inspector input").value = name;
      doc.querySelector("#inspector form").requestSubmit();
    };
    const expectEditAndHistory = (name, editedName) => {
      equal(byId("project-title").textContent, `${editedName} · Edited`, "Kept the edit when discard was declined");
      byId("undo").click();
      equal(byId("project-title").textContent, name, "Kept the project's undo history");
      byId("redo").click();
      equal(byId("project-title").textContent, `${editedName} · Edited`, "Kept the project's redo history");
      byId("undo").click();
    };
    const chooseFile = (picker, name, bytes, beforeRead) => {
      const file = new iframe.contentWindow.File([bytes], name);
      const read = file.arrayBuffer.bind(file);
      file.arrayBuffer = async () => { await beforeRead?.(); return read(); };
      const transfer = new iframe.contentWindow.DataTransfer();
      transfer.items.add(file);
      picker.files = transfer.files;
    };
    const openFile = (name, bytes, beforeRead) => {
      const picker = byId("project-file");
      picker.click = () => {};
      byId("open").click();
      chooseFile(picker, name, bytes, beforeRead);
      return picker.onchange({ target: picker });
    };
    const openDemo = () => {
      byId("tools").click();
      doc.querySelector("#dialog select").value = "demo";
      return submitDialog();
    };
    const dialog = byId("dialog");

    const write = gate();
    const a = folder("folder-a", undefined, { beforeWrite: write.pause });
    const b = folder("folder-b", project("Project B"));
    const originalName = byId("project-title").textContent;
    byId("save").click();
    doc.querySelector("#dialog select").value = "new-folder";
    picks.push(a);
    const savingA = submitDialog();
    await write.entered;
    byId("dialog").close();
    await open(b);
    equal(byId("project-title").textContent, "Project B", "Opened B while A was writing");
    write.resume();
    await savingA;
    equal(savedName(a), originalName, "A received its own manifest");
    byId("save").click();
    const destination = doc.querySelector("#dialog select").selectedOptions[0].textContent;
    equal(destination, "Save in folder-b", "B kept its save destination after A finished");
    await submitDialog();
    equal(byId("status").textContent, "Saved studio.json in folder-b", "B's folder save completed");
    equal(savedName(b), "Project B", "B saved with its own disk fingerprint");
    equal(savedName(a), originalName, "B did not overwrite A");

    const read = gate();
    const openingC = open(folder("folder-c", project("Project C"), { beforeRead: read.pause }));
    await read.entered;
    rename("Edited B");
    equal(byId("project-title").textContent, "Edited B · Edited", "Edited B while C was loading");
    read.resume();
    await openingC;
    equal(confirmations, 1, "Asked whether to discard the edit made during the read");
    expectEditAndHistory("Project B", "Edited B");

    const fileRead = gate();
    const openingFile = openFile("studio.json", project("File project"), fileRead.pause);
    await fileRead.entered;
    rename("Edited during file open");
    fileRead.resume();
    await openingFile;
    equal(confirmations, 2, "Asked whether to discard the edit made during the file read");
    expectEditAndHistory("Project B", "Edited during file open");

    const { default: init, Studio } = await import(site + "pkg/studio_web.js");
    await init();
    const zipProject = new Studio(project("ZIP project"));
    const zip = zipProject.save(true);
    zipProject.free();
    const zipRead = gate();
    const openingZip = openFile("studio-project.zip", zip, zipRead.pause);
    await zipRead.entered;
    await open(folder("folder-d", project("Project D")));
    zipRead.resume();
    await openingZip;
    equal(byId("project-title").textContent, "Project D", "A pending ZIP never replaces a different active project");
    equal(confirmations, 2, "No discard prompt for a stale ZIP read");
    await openFile("studio-project.zip", zip);
    equal(byId("project-title").textContent, "ZIP project", "Opened a ZIP without concurrent edits");

    demoRead = gate();
    const openingDemo = openDemo();
    await demoRead.entered;
    byId("dialog").close();
    rename("Edited during demo open");
    demoRead.resume();
    await openingDemo;
    equal(confirmations, 3, "Asked whether to discard the edit made during the demo fetch");
    expectEditAndHistory("ZIP project", "Edited during demo open");
    demoRead = undefined;
    await openDemo();
    equal(byId("project-title").textContent, originalName, "Opened the demo without concurrent edits");

    const mapAssets = (source) => ({
      ground: { kind: "tileset", data: { tiles: [], metatiles: [] } },
      map: { kind: "map", data: {
        tileset: "ground", width: 1, height: 1, cell_width: 1, cell_height: 1,
        layers: [{ id: `${source}-layer`, visible: true, cells: [null] }], metadata: { source },
      } },
    });
    await open(folder("map-a", project("Map project A", mapAssets("a"))));
    const mapRead = gate();
    const mapB = folder("map-b", project("Map project B", mapAssets("b")), { beforeRead: mapRead.pause });
    const openingMapB = open(mapB);
    await mapRead.entered;
    const addLayer = () => Array.from(byId("inspector").querySelectorAll("button"))
      .find((node) => node.textContent === "Add").click();
    addLayer();
    equal(byId("dialog-title").textContent, "Add map layer", "Opened A's map dialog during the read");
    dialog.querySelector("input").value = "extra-layer";
    const staleLayerSubmit = byId("dialog-content").onsubmit;
    mapRead.resume();
    await openingMapB;
    const wasOpen = dialog.open;
    await staleLayerSubmit(new iframe.contentWindow.Event("submit"));
    equal(byId("project-title").textContent, "Map project B", "Submitting A's stale dialog left B clean");
    equal(wasOpen, false, "Replacing A dismissed its map dialog");
    equal(byId("undo").disabled, true, "A's stale dialog created no history in B");
    byId("save").click();
    await submitDialog();
    const savedMap = JSON.parse(new TextDecoder().decode(mapB.files.get("studio.json"))).assets.map.data;
    equal(savedMap.metadata.source, "b", "B kept its own map metadata");
    equal(savedMap.layers.map((layer) => layer.id).join(","), "b-layer", "B kept its own map layers");
    addLayer();
    dialog.querySelector("input").value = "extra-layer";
    await submitDialog();
    equal(byId("project-title").textContent, "Map project B · Edited", "B's new map dialog applied its edit");
    byId("undo").click();

    await open(folder("save-source", project("Original revision")));
    const olderWrite = gate();
    const olderFolder = folder("older-save", undefined, { beforeWrite: olderWrite.pause });
    const newerFolder = folder("newer-save");
    const saveAs = (directory) => {
      byId("save").click();
      doc.querySelector("#dialog select").value = "new-folder";
      picks.push(directory);
      return submitDialog();
    };

    const olderSave = saveAs(olderFolder);
    await olderWrite.entered;
    byId("dialog").close();
    rename("Newer revision");
    await saveAs(newerFolder);
    equal(byId("project-title").textContent, "Newer revision", "Newer save marked its revision clean");
    olderWrite.resume();
    await olderSave;
    equal(savedName(olderFolder), "Original revision", "Older save wrote its own revision");
    equal(savedName(newerFolder), "Newer revision", "Newer save wrote the edited revision");
    equal(byId("project-title").textContent, "Newer revision", "Late save kept the newer revision clean");
    equal(byId("status").textContent, "Saved studio.json in newer-save", "Late save kept the newer save status");
    byId("save").click();
    equal(doc.querySelector("#dialog select").selectedOptions[0].textContent, "Save in newer-save", "Late save kept the newer destination");
    await submitDialog();
    equal(byId("status").textContent, "Saved studio.json in newer-save", "Next save used the newer destination's fingerprint");

    let stagedWrite = gate();
    let committing;
    let abortedWrites = 0;
    const originalManifest = project("Project before Cancel");
    const destinationFolder = folder("cancel-save", originalManifest, {
      beforeWrite: () => stagedWrite?.pause(),
      beforeClose: () => committing?.pause(),
      onAbort: () => { abortedWrites++; },
    });
    await open(destinationFolder);
    rename("Edited before Cancel");
    const cancelButton = () => dialog.querySelector("button[type=button]");
    byId("save").click();
    const canceledSave = submitDialog();
    await stagedWrite.entered;
    equal(cancelButton().textContent, "Cancel", "Found the save dialog's Cancel button");
    equal(cancelButton().disabled, false, "Cancel was available while the write was staged");
    cancelButton().click();
    equal(dialog.open, false, "Cancel closed the save dialog");
    stagedWrite.resume();
    await canceledSave;
    equal(abortedWrites, 1, "Cancel aborted the staged writable");
    equal(destinationFolder.files.get("studio.json"), originalManifest, "Cancel preserved the on-disk manifest");
    equal(destinationFolder.files.size, 1, "Cancel removed the save marker");
    equal(byId("project-title").textContent, "Edited before Cancel · Edited", "Canceled edits stayed unsaved");

    stagedWrite = undefined;
    committing = gate();
    byId("save").click();
    const committedSave = submitDialog();
    await committing.entered;
    equal(cancelButton().disabled, true, "Cancel was disabled once commit began");
    equal(dialog.querySelector("button[type=submit]").textContent, "Saving…", "The dialog showed commit progress");
    cancelButton().click();
    dialog.requestClose();
    equal(dialog.open, true, "A dismissal request could not close the dialog during commit");
    committing.resume();
    await committedSave;
    equal(savedName(destinationFolder), "Edited before Cancel", "Retry committed the edited manifest");
    equal(byId("project-title").textContent, "Edited before Cancel", "Commit marked the edit saved");

    const demo = new Studio(new Uint8Array(await (await fetch(site + "demo/studio.json")).arrayBuffer()));
    const png = demo.export("compass", '{"format":"indexed-png"}');
    const wav = demo.export("test-pulse", '{"format":"wav"}');
    demo.free();

    const startImport = async (action, filename, bytes, beforeRead) => {
      byId("tools").click();
      dialog.querySelector("select").value = action;
      await submitDialog();
      if (action === "image") dialog.querySelector('input[type="checkbox"]').checked = true;
      chooseFile(dialog.querySelector('input[type="file"]'), filename, bytes, beforeRead);
      return submitDialog();
    };
    const hasAsset = (id) => Array.from(byId("assets").querySelectorAll("button"))
      .some((node) => node.textContent === id);
    for (const [action, filename, bytes, id] of [
      ["image", "compass.png", png, "imported-tiles"],
      ["sample", "test-pulse.wav", wav, "sample"],
    ]) {
      const sourceName = `Project before ${filename}`;
      await open(folder("import-source", project(sourceName)));
      const canceledRead = gate();
      const canceledImport = startImport(action, filename, bytes, canceledRead.pause);
      await canceledRead.entered;
      if (action === "image") cancelButton().click();
      else dialog.requestClose();
      equal(dialog.open, false, `Dismissed the ${filename} import while reading`);
      canceledRead.resume();
      await canceledImport;
      equal(hasAsset(id), false, `Cancel prevented the ${filename} import`);
      equal(byId("project-title").textContent, sourceName, "Cancel left the project clean");

      const replacementName = `Replacement during ${filename}`;
      const replacementRead = gate();
      const replacing = open(folder("import-replacement", project(replacementName), { beforeRead: replacementRead.pause }));
      await replacementRead.entered;
      const staleRead = gate();
      const staleImport = startImport(action, filename, bytes, staleRead.pause);
      await staleRead.entered;
      replacementRead.resume();
      await replacing;
      equal(dialog.open, false, "Replacing the project dismissed its pending import dialog");
      staleRead.resume();
      await staleImport;
      equal(hasAsset(id), false, `The replacement project did not receive ${filename}`);
      equal(byId("project-title").textContent, replacementName, "The replacement project stayed clean");
      equal(byId("status").textContent, "Project ready", "A stale import left the replacement status intact");

      await startImport(action, filename, bytes);
      equal(hasAsset(id), true, `An active import added ${filename}`);
      byId("undo").click();
    }

    const sampleRate = 32000;
    const loopStart = sampleRate / 10;
    const pcm = [...Array(loopStart).fill(-8192), ...Array(loopStart).fill(16384)];
    const lowRate = 1000;
    const lowRatePcm = pcm.slice(0, lowRate / 5);
    await open(folder("audio-preview", project("Audio preview", {
      "one-shot": { kind: "sample", data: { sample_rate: lowRate, pcm: lowRatePcm, loop_start: null } },
      "with-loop": { kind: "sample", data: { sample_rate: sampleRate, pcm, loop_start: loopStart } },
    })));
    const browser = iframe.contentWindow;
    const AudioContext = browser.AudioContext;
    let playback;
    let source;
    let analyser;
    class TestAudioContext extends AudioContext {
      constructor() {
        super({ sinkId: { type: "none" } });
        playback = this;
      }
      createBufferSource() {
        source = super.createBufferSource();
        analyser = this.createAnalyser();
        source.connect(analyser);
        return source;
      }
    }
    const play = (id) => {
      source = undefined;
      browser.AudioContext = TestAudioContext;
      try {
        Array.from(byId("assets").querySelectorAll("button")).find((node) => node.textContent === id).click();
        Array.from(byId("toolbar").querySelectorAll("button")).find((node) => node.textContent === "Play audio").click();
      } finally { browser.AudioContext = AudioContext; }
    };
    play("with-loop");
    equal(source?.loop, true, "Sample with a loop point used looping playback");
    const loopSeconds = source.loopStart / source.playbackRate.value;
    if (Math.abs(loopSeconds - 0.1) > 0.00001) throw new Error(`Unexpected loop start at ${loopSeconds} s`);
    while (playback.currentTime < 0.35) {
      if (result.dataset.result === "failed") {
        throw new Error(`Looping audio stopped at ${playback.currentTime} s (${playback.state})`);
      }
      await new Promise((resolve) => setTimeout(resolve, 20));
    }
    const output = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(output);
    if (!output.every((value) => Math.abs(value - 0.5) < 0.01)) {
      throw new Error("Looping playback did not continue with the authored tail");
    }
    const closedPlayback = new Promise((resolve) => playback.addEventListener("statechange", () => {
      if (playback.state === "closed") resolve();
    }));
    Array.from(dialog.querySelectorAll("button")).find((node) => node.textContent === "Close").click();
    await closedPlayback;

    play("one-shot");
    equal(source?.loop, false, "Low-rate sample used one-shot PCM playback");
    equal(source.buffer.length, lowRatePcm.length, "One-shot preview kept every authored sample");
    const duration = source.buffer.duration / source.playbackRate.value;
    if (Math.abs(duration - lowRatePcm.length / lowRate) > 0.00001) {
      throw new Error(`Unexpected one-shot duration of ${duration} s`);
    }
    await new Promise((resolve) => source.addEventListener("ended", resolve, { once: true }));
    const replay = Array.from(dialog.querySelectorAll("button")).find((node) => node.textContent === "Play");
    equal(Boolean(replay), true, "One-shot preview offered replay after ending");
    const firstSource = source;
    replay.click();
    equal(source === firstSource, false, "Replay started a fresh one-shot source");
    Array.from(dialog.querySelectorAll("button")).find((node) => node.textContent === "Close").click();

    report("passed", "Studio project and audio workflow regressions passed.");
  } catch (error) {
    report("failed", error.stack);
  } finally {
    clearTimeout(timeout);
  }
</script>
